<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Social links profile</title>

  <style>
    :root {
      --color-bg: #000000;
      --color-card: #1F1F1F;
      --color-btn: hsl(0, 0%, 20%);
      --color-btn-hover: #C4E052;
      --color-text: #FFFFFF;
      --color-location: #C4E052;
      --color-description: #FFFFFF;
      --radius-card: 0.9375rem;
      --radius-btn: 0.75rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      font-family: 'Inter', sans-serif;
    }

    .container {
      display: flex;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--color-bg);
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .card {
      width: 90%;
      max-width: clamp(20rem, 90%, 24rem);
      display: flex;
      flex-direction: column;
      background-color: var(--color-card);
      border-radius: var(--radius-card);
      align-items: center;
      padding: 2rem 1.75rem;
    }

    .image {
      width: 6rem;
      height: 6rem;
      border-radius: 50%;
      object-fit: cover;
    }

    .name {
      color: var(--color-text);
      font-weight: 600;
      font-size: 1.5rem;
      margin-top: 1rem;
      margin-bottom: 0;
    }

    .location {
      color: var(--color-location);
      font-weight: 600;
      margin-top: 0.5rem;
      font-size: 0.875rem;
    }

    .description {
      color: var(--color-description);
      font-weight: 400;
      font-size: 0.875rem;
      margin-top: 0.75rem;
      text-align: center;
    }

    .social {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    button {
      background-color: var(--color-btn);
      color: var(--color-text);
      border-radius: var(--radius-btn);
      padding: 1rem 0;
      width: 100%;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      transition: background-color 0.2s, color 0.2s;
    }

    button:hover {
      background-color: var(--color-btn-hover);
      color: #000000;
    }
  </style>
</head>
<body>

<div class="container">
  <main>
    <div class="card">
      <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall avatar" class="image">
      <h1 class="name">Jessica Randall</h1>
      <p class="location">London, United Kingdom</p>
      <p class="description">"Front-end developer and avid reader."</p>

      <div class="social">
        <button>GitHub</button>
        <button>Frontend Mentor</button>
        <button>LinkedIn</button>
        <button>Twitter</button>
        <button>Instagram</button>
      </div>
    </div>
  </main>
</div>

</body>
</html>
